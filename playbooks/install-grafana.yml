---
- name: Install grafana server
  become: Yes
  hosts: infra

  tasks:
  - name: Wget rpm grafana
    ansible.builtin.get_url:
      url: https://dl.grafana.com/grafana/release/13.1.3/grafana_13.1.3_31135815010_linux_amd64.rpm
      dest: /home/snd/grafana.rpm
    tags:
      - grafana

  - name: Install rpm
    ansible.builtin.dnf:
      name: /home/snd/grafana.rpm
      state: present
      disable_gpg_check: yes
    tags:
      - grafana

  - name: Start and enable
    ansible.builtin.systemd_service:
      name: grafana-server
      daemon_reload: true
      state: started
      enabled: true
    tags:
      - grafana
      - systemd
