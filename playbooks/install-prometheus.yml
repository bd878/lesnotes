---
- name: Install prometheus
  become: Yes
  hosts: infra

  tasks:
  - name: Install prometheus
    ansible.builtin.dnf:
      name: prometheus
      state: present
      allow_downgrade: yes

  - name: Setup config
    ansible.builtin.template:
      src: templates/prometheus/prometheus.yml.j2
      dest: /etc/prometheus/prometheus.yml

  - name: Setup log dir
    ansible.builtin.file:
      path: /var/log/prometheus
      state: directory
      owner: prometheus
      group: prometheus
      mode: '0755'

  - name: Start and enable
    ansible.builtin.systemd_service:
      name: prometheus
      daemon_reload: true
      state: started
      enabled: true

