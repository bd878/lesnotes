---
- name: Save db service conf, update systemd service file
  hosts: gallery-prod-4
  become: Yes

  tasks:
  - name: Stop services
    ansible.builtin.systemd_service:
      name: "{{ item }}-db"
      state: stopped
      enabled: false
    loop:
      - search
      - billing
      - sessions
      - threads
      - users
      - messages

  - name: Remove db service files
    ansible.builtin.file:
      path: "{{ item }}"
      state: absent
    with_items:
      - /etc/systemd/system/search-db.service 
      - /etc/systemd/system/sessions-db.service 
      - /etc/systemd/system/threads-db.service 
      - /etc/systemd/system/messages-db.service 
      - /etc/systemd/system/billing-db.service 
      - /etc/systemd/system/users-db.service 

  - name: Write db conf file
    tags:
      - envs
    ansible.builtin.template:
      src: templates/{{ item }}_db.conf.j2
      dest: /srv/gallery/prod/{{ item }}/config/db.conf
      owner: snd
      group: snd
      mode: '644'
    loop:
      - search
      - sessions
      - users
      - billing
      - threads
      - messages

  - name: Write db services 
    ansible.builtin.template:
      src: templates/db.service.j2
      dest: /etc/systemd/system/{{ item }}-db.service
    notify: Reload systemd daemon
    loop:
      - search
      - sessions
      - users
      - billing
      - threads
      - messages

  - name: Start services
    ansible.builtin.systemd_service:
      name: "{{ item }}-db"
      state: started
      enabled: true
    loop:
      - search
      - billing
      - sessions
      - threads
      - users
      - messages

  handlers:
  - name: Reload systemd daemon
    ansible.builtin.systemd_service:
      daemon_reload: true
