---
- name: Save systemd services
  hosts: hosts
  become: Yes

  tasks:
  - name: Stop grpc services
    ansible.builtin.systemd_service:
      name: gallery-{{ item }}
      state: stopped
      enabled: false
    loop:
      - search
      - sessions
      - threads
      - users
      - messages

  - name: Stop http services
    ansible.builtin.systemd_service:
      name: gallery-{{ item }}-http
      state: stopped
      enabled: false
    loop:
      - search
      - threads
      - users
      - messages

  - name: Remove service files
    ansible.builtin.file:
      path: "{{ item }}"
      state: absent
    with_items:
      - /etc/systemd/system/gallery-search.service 
      - /etc/systemd/system/gallery-search-http.service 
      - /etc/systemd/system/gallery-sessions.service 
      - /etc/systemd/system/gallery-threads.service 
      - /etc/systemd/system/gallery-threads-http.service 
      - /etc/systemd/system/gallery-messages.service 
      - /etc/systemd/system/gallery-messages-http.service 
      - /etc/systemd/system/gallery-users.service 
      - /etc/systemd/system/gallery-users-http.service 

    notify: Reload systemd daemon

  - name: Write db services
    ansible.builtin.template:
      src: templates/db.service.j2
      dest: /etc/systemd/system/{{ item }}-db.service
    notify: Reload systemd daemon
    loop:
      - search
      - sessions
      - users
      - threads
      - messages

  - name: Write endpoint services
    ansible.builtin.template:
      src: templates/endpoint.service.j2
      dest: /etc/systemd/system/{{ item }}.service
    notify: Reload systemd daemon
    loop:
      - search
      - users
      - threads
      - messages

  handlers:
  - name: Reload systemd daemon
    ansible.builtin.systemd_service:
      daemon_reload: true
