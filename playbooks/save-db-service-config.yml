---
- name: Save service and db config
  hosts: hosts

  tasks:
  - name: Write db config
    ansible.builtin.template:
      src: templates/{{ item }}_db.json.j2
      dest: /srv/gallery/prod/{{ item }}/config/db.json
    tags:
      - db
    loop:
      - billing
      - search
      - messages
      - threads
      - users
      - sessions

  - name: Remove stale files
    tags:
      - stale
    ansible.builtin.file:
      state: absent
      path: "{{ item }}"
    with_items:
      - /srv/gallery/prod/billing/config/otel.conf
      - /srv/gallery/prod/billing/config/grpc.conf
      - /srv/gallery/prod/billing/config/grpc.json
      - /srv/gallery/prod/billing/config/http.json
      - /srv/gallery/prod/billing/grpc
      - /srv/gallery/prod/billing/http
      - /srv/gallery/prod/search/config/otel.conf
      - /srv/gallery/prod/search/config/grpc.conf
      - /srv/gallery/prod/search/config/grpc.json
      - /srv/gallery/prod/search/config/http.json
      - /srv/gallery/prod/search/grpc
      - /srv/gallery/prod/search/http
      - /srv/gallery/prod/messages/config/otel.conf
      - /srv/gallery/prod/messages/config/grpc.conf
      - /srv/gallery/prod/messages/config/grpc.json
      - /srv/gallery/prod/messages/config/http.json
      - /srv/gallery/prod/messages/grpc
      - /srv/gallery/prod/messages/http
      - /srv/gallery/prod/threads/config/otel.conf
      - /srv/gallery/prod/threads/config/grpc.conf
      - /srv/gallery/prod/threads/config/grpc.json
      - /srv/gallery/prod/threads/config/http.json
      - /srv/gallery/prod/threads/grpc
      - /srv/gallery/prod/threads/http
      - /srv/gallery/prod/users/config/otel.conf
      - /srv/gallery/prod/users/config/grpc.conf
      - /srv/gallery/prod/users/config/grpc.json
      - /srv/gallery/prod/users/config/http.json
      - /srv/gallery/prod/users/grpc
      - /srv/gallery/prod/users/http
      - /srv/gallery/prod/sessions/config/otel.conf
      - /srv/gallery/prod/sessions/config/grpc.conf
      - /srv/gallery/prod/sessions/config/grpc.json
      - /srv/gallery/prod/sessions/config/http.json
      - /srv/gallery/prod/sessions/grpc

  - name: Write endpoint envs
    tags:
      - envs
    ansible.builtin.template:
      src: templates/{{ item }}.conf.j2
      dest: /srv/gallery/prod/{{ item }}/config/service.conf
    loop:
      - billing
      - search
      - messages
      - threads
      - users

  - name: Flush pending handlers
    ansible.builtin.meta: flush_handlers

  - name: Write service config
    ansible.builtin.template:
      src: templates/{{ item }}.json.j2
      dest: /srv/gallery/prod/{{ item }}/config/service.json
    tags:
      - service
    loop:
      - billing
      - search
      - messages
      - threads
      - users

