---
- name: Rename data paths
  hosts: gallery-stage

  tasks:
  - name: Update database paths
    ansible.builtin.copy:
      src: /srv/gallery/stage/data.{{ item.port }}
      dest: /srv/gallery/stage/data.{{ item.name }}
      mode: preserve
      remote_src: true
    loop:
      - { name: 'sessions', port: '9134' }
      - { name: 'messages', port: '9104' }
      - { name: 'threads', port: '9144' }
      - { name: 'users', port: '9124' }
      - { name: 'billing', port: '9154' }
      - { name: 'search', port: '9114' }

  - name: Remove stale data paths
    ansible.builtin.file:
      state: absent
      path: /srv/gallery/stage/data.{{ item }}
    tags:
      - remove
    loop:
      - 9131
      - 9101
      - 9141
      - 9121
      - 9151
      - 9111
    
