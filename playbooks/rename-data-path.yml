---
- name: Rename data paths
  hosts: gallery-prod

  tasks:
  - name: Update database paths
    ansible.builtin.copy:
      src: /srv/gallery/prod/data.{{ item.port }}/raft
      dest: /srv/gallery/prod/data.{{ item.name }}
      mode: preserve
      remote_src: true
    loop:
      - { name: 'sessions', port: '9031' }
      - { name: 'messages', port: '9001' }
      - { name: 'threads', port: '9041' }
      - { name: 'users', port: '9021' }
      - { name: 'billing', port: '9051' }
      - { name: 'search', port: '9011' }

  - name: Remove stale data paths
    ansible.builtin.file:
      state: absent
      path: /srv/gallery/prod/data.{{ item }}
    tags:
      - remove
    loop:
      - 9031
      - 9001
      - 9041
      - 9021
      - 9051
      - 9011
    
