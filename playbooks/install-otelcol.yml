---
- name: Install and setup otelcol
  become: Yes
  hosts: infra

  tasks:
  - name: Set messages endpoints
    ansible.builtin.set_fact:
      messages_endpoints: |
        {% set server_list = [] %}
        {% for s in groups['hosts'] %}
        {%   set port = hostvars[s]['messages_http_port'] %}
        {%   set host = hostvars[s]['addr'] %}
        {%   set _ = server_list.append(host ~ ':' ~ port) %}
        {% endfor %}
        {{ server_list }}
    tags:
      - debug
      - otelcol

  - name: Show targets
    ansible.builtin.debug:
      var: messages_endpoints
    tags:
      - debug

  - name: Install otelcol
    ansible.builtin.get_url:
      url: https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v0.154.0/otelcol_0.154.0_linux_amd64.rpm 
      dest: /home/snd/otelcol.rpm
    tags:
      - otelcol

  - name: Install rpm otelcol
    ansible.builtin.dnf:
      name: /home/snd/otelcol.rpm
      state: present
      disable_gpg_check: yes
    tags:
      - otelcol

  - name: Setup otelcol config
    ansible.builtin.template:
      src: templates/otelcol/config.yaml.j2
      dest: /etc/otelcol/config.yaml
    tags:
      - otelcol

  - name: Create systemd service
    ansible.builtin.template:
      src: templates/otelcol.service.j2
      dest: /etc/systemd/system/otelcol.service
    tags:
      - otelcol

  - name: Start and enable
    ansible.builtin.systemd_service:
      name: otelcol
      daemon_reload: true
      state: started
      enabled: true
    tags:
      - otelcol
