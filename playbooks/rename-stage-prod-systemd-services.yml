---
- name: Rename systemd services from stage to prod
  hosts: hosts
  become: Yes

  tasks:
  - name: Stop services
    ansible.builtin.systemd_service:
      name: "{{ item }}-db"
      state: stopped
      enabled: false
    loop:
      - search
      - billing
      - sessions
      - threads
      - users
      - messages

  - name: Stop endpoint services
    ansible.builtin.systemd_service:
      name: "{{ item }}"
      state: stopped
      enabled: false
    loop:
      - search
      - threads
      - users
      - messages
      - billing

  - name: Remove service files
    ansible.builtin.file:
      path: "{{ item }}"
      state: absent
    with_items:
      - /etc/systemd/system/search-db.service 
      - /etc/systemd/system/search.service 
      - /etc/systemd/system/sessions-db.service 
      - /etc/systemd/system/threads-db.service 
      - /etc/systemd/system/threads.service 
      - /etc/systemd/system/messages-db.service 
      - /etc/systemd/system/messages.service 
      - /etc/systemd/system/billing-db.service 
      - /etc/systemd/system/billing.service 
      - /etc/systemd/system/users-db.service 
      - /etc/systemd/system/users.service 

    notify: Reload systemd daemon

  - name: Write db services
    ansible.builtin.template:
      src: templates/db.service.j2
      dest: /etc/systemd/system/{{ item }}-db.service
    notify: Reload systemd daemon
    loop:
      - search
      - sessions
      - users
      - billing
      - threads
      - messages

  - name: Write endpoint services
    ansible.builtin.template:
      src: templates/endpoint.service.j2
      dest: /etc/systemd/system/{{ item }}.service
    notify: Reload systemd daemon
    loop:
      - search
      - users
      - threads
      - messages
      - billing

  handlers:
  - name: Reload systemd daemon
    ansible.builtin.systemd_service:
      daemon_reload: true
