---
- name: Restart db services after data path renaming
  become: Yes
  hosts: gallery-stage

  tasks:
  - name: Restart
    ansible.builtin.service:
      name: "{{ item }}-db"
      state: restarted
      daemon_reload: true
    loop:
      - sessions
      - messages
      - threads
      - search
      - billing
      - users
