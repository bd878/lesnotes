syntax = "proto3";

package threads_messages.v1;

option go_package = "github.com/bd878/gallery/server/api/threads";

// events

message ThreadCreated {
	int64  id = 1;
	int64  user_id = 2;
	int64  parent_id = 3;
	string name = 4;
	string description = 5;
	bool   private = 6;
	string created_at = 7;
	string updated_at = 8;
	string title = 9;
}

message ThreadDeleted {
	int64  id = 1;
	int64  user_id = 2;
}

message ThreadUpdated {
	int64  id = 1;
	int64  user_id = 2;
	optional string name = 3;
	optional string description = 4;
	optional string title = 5;
	string updated_at = 6;
}

message ThreadPublished {
	int64  id = 1;
	int64  user_id = 2;
	string updated_at = 3;
}

message ThreadPrivated {
	int64  id = 1;
	int64  user_id = 2;
	string updated_at = 3;
}

message ThreadParentChanged {
	int64  id = 1;
	int64  user_id = 2;
	int64  parent_id = 3;
}

// commands

message CreateThread {
	int64 thread_id = 1;
	int64 user_id = 2;
	int64 parent_id = 3;
	string name = 4;
	optional string description = 5;
	optional bool private = 6;
	optional string title = 7;
}
