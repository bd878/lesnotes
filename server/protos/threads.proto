syntax = "proto3";

package threads.v1;

import "protos/distributed.proto";

option go_package = "github.com/bd878/gallery/server/api/threads";

service Threads {
	rpc Apply(distributed.v1.Command) returns (distributed.v1.CommandResponse) {}
	rpc List(ListRequest) returns (ListResponse) {}
	rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse) {}
	rpc Read(ReadRequest) returns (Thread) {}
	rpc ReadParent(ReadParentRequest) returns (ReadParentResponse) {}
	rpc Resolve(ResolveRequest) returns (ResolveResponse) {}
	rpc Count(CountRequest) returns (CountResponse) {}
	rpc CountMessages(CountMessagesRequest) returns (CountMessagesResponse) {}
}

message ThreadsSnapshot {
	oneof Item {
		ThreadSnapshotItem thread = 1;
	}
}

message ThreadSnapshotItem {
	int64    id = 1;
	string   name = 2;
	bool     private = 3;
	int64    user_id = 4;
	int64    parent_id = 5;
	int64    next_id = 6;
	int64    prev_id = 7;
	int32    count = 8;
	string   description = 9;
	string   created_at = 10;
	string   updated_at = 11;
	string   title = 12;	
	bool     private_message = 13;
}

message Thread {
	int64    id = 1;
	string   name = 2;
	bool     private = 3;
	int64    user_id = 4;
	int64    parent_id = 5;
	int64    next_id = 6;
	int64    prev_id = 7;
	int32    count = 8;
	string   description = 9;
	string   created_at = 10;
	string   updated_at = 11;
	string   title = 12;
	bool     private_message = 13;
}

message ListRequest {
	int64 user_id = 1;
	int64 parent_id = 2;
	int32 limit = 3;
	int32 offset = 4;
	bool  asc = 5;
}

message ListMessagesRequest {
	int64 user_id = 1;
	int64 parent_id = 2;
	int32 limit = 3;
	int32 offset = 4;
	bool  asc = 5;
	optional bool private = 6;
}

message ListResponse {
	repeated Thread list = 1;
	bool  is_last_page = 2;
	int32 count = 3;
}

message ListMessagesResponse {
	repeated Thread list = 1;
	bool  is_last_page = 2;
	int32 count = 3;
}

message ReadRequest {
	int64 id = 1;
	int64 user_id = 2;
	string name = 3;
}

message ResolveRequest {
	int64     id = 1;
	int64     user_id = 2;
}

message PathStep {
	int64     id = 1;
	string    name = 2;
	bool      private = 3;
	string    title = 4;
}

message ResolveResponse {
	repeated PathStep path = 1;
}

message ReadParentRequest {
	int64     id = 1;
	int64     user_id = 2;
}

message ReadParentResponse {
	optional Thread    parent = 1;
	bool      is_root = 2;
}

message CountRequest {
	int64     id = 1;
	int64     user_id = 2;
}

message CountMessagesRequest {
	int64     id = 1;
	int64     user_id = 2;
	optional bool private_message = 3;
}

message CountResponse {
	int32     total = 1;
}

message CountMessagesResponse {
	int32     total = 1;
}
