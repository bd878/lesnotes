syntax = "proto3";

option go_package = "github.com/bd878/gallery/server/api/messages";

message AppendCommand {
	int64   id = 1;
	int64   user_id = 2;
	repeated int64   file_ids = 3;
	string  text = 4;
	string  name = 5;
	bool    private = 6;
	string  title = 7;
	string  created_at = 8;
	string  updated_at = 9;
}

message UpdateCommand {
	int64   id = 1;
	int64   user_id = 2;
	repeated int64   file_ids = 3;
	optional string  text = 4;
	optional string  name = 5;
	optional string  title = 6;
	string  updated_at = 7;
}

message DeleteCommand {
	int64   id = 1;
	int64   user_id = 2;
}

message DeleteUserMessagesCommand {
	int64   user_id = 1;
}

message PublishCommand {
	repeated int64   ids = 1;
	int64   user_id = 2;
	string  updated_at = 3;
}

message PrivateCommand {
	repeated int64 ids = 1;
	int64   user_id = 2;
	string  updated_at = 3;
}
