openapi: "3.0.0"
info:
  title: API Specification for search service
  description: |
    This API allows searching through various messages and files
  version: 1.0.0
paths:
  # SEARCH MESSAGES
  /search/v1/messages:
    get:
      summary: Search messages by text
      description: |
        It searches in a user's messages, both public and private,
        for a substring of a given string.
        Search is case insensitive
      operationId: searchMessages
      parameters:
        - $ref: '#/components/parameters/token'
        - $ref: '#/components/parameters/user'
        - name: query
          in: query
          type: string
          required: true
        - name: thread
          in: query
          type: integer
          required: false
        - name: public
          in: query
          type: integer
          required: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/searchOk'
        "4XX":
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serverError'

  /search/v2/messages:
    post:
      summary: Search messages by text
      description: |
        It searches in a user's messages, both public and private,
        for a substring of a given string.
        Search is case insensitive. Searches via json api
      operationId: searchMessagesJson
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/searchMessagesJson'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/searchOk'
        "4XX":
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serverError'

  # SEARCH FILES
  /search/v1/files:
    get:
      summary: Search files by text
      description: |
        Searches user files, both public and private,
        by given substring in file name
      operationId: searchFiles
      parameters:
        - $ref: '#/components/parameters/token'
        - $ref: '#/components/parameters/user'
        - name: query
          in: query
          type: string
          required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/searchOk"
        "4XX":
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serverError'

  /search/v2/files:
    post:
      summary: Search files by text
      description: |
        Searches user files, both public and private,
        by given substring in file name. Searches via json api
      operationId: searchFilesJson
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/searchFilesJson'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/searchOk"
        "4XX":
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serverError'

components:
  parameters:
    token:
      name: Cookie
      in: header
      schema:
        type: string
        example: token=AAAAAA
    user:
      name: user
      in: query
      required: false
      schema:
        type: integer
        example: 1

  schemas:
    serverError:
      type: object
      properties:
        status:
          type: string
          default: "error"
        error:
          type: object
          properties:
            code:
              type: integer
            explain:
              type: string
            human:
              type: string

    searchMessagesJson:
      type: object
      properties:
        token:
          type: string
          example: "AAAAAA"
        request:
          type: object
          properties:
            query:
              type: string
            thread:
              type: integer
            public:
              type: integer

    searchFilesJson:
      type: object
      properties:
        token:
          type: string
          example: "AAAAAA"
        request:
          type: object
          properties:
            user:
              type: integer

    searchOk:
      type: object
      properties:
        status:
          type: string
        response:
          type: object
          properties:
            count:
              type: integer
            list:
              type: array
              items:
                oneOf:
                  - $ref: '#/components/schemas/message'
                  - $ref: '#/components/schemas/file'

    message:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        name:
          type: string
        title:
          type: string
        text:
          type: string

    file:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        name:
          type: string